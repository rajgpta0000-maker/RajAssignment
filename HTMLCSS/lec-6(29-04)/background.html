<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Example</title>
    <style>
        .box{
            width: 100%;
            height: 400px;   /* fixed */
            margin: 20px 0px;
        }

        .box-1{
            background-color: lightblue;
        }

        .box-2{
            background: linear-gradient(to bottom right, green, lightgreen);
        }

        .box-3{
            background: radial-gradient(blue 40%, lightblue);
        }

        .box-4{
            background: conic-gradient(red 30%, yellow 30% 60%, green 60%);
        }

        .box-5{
            background: repeating-linear-gradient(
                to right,
                rgb(65, 204, 53),
                rgb(65, 204, 53) 20px,
                brown 20px,
                brown 40px
            );
        }
    </style>
</head>
<body>
    <div class="box box-1"></div>
    <div class="box box-2"></div>
    <div class="box box-3"></div>   
    <div class="box box-4"></div>
    <div class="box box-5"></div> <!-- added -->
</body>
</html>
