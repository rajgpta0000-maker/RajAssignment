<!DOCTYPE html>
<html>
<head>
  <title>Advanced List Example</title>
  
</head>

<body>

<h2>Advanced HTML Lists</h2>


<h3>Subjects (Ordered List)</h3>
<ul class="roman">
  <li>Mathematics</li>
  <li>Science
    
    <ul class="circle">
      <li>Physics</li>
      <li>Chemistry</li>
      <li>Biology</li>
    </ul>
  </li>
  <li>Computer Science
    
    <ul class="alpha">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
  </li>
</ul>


<h3>Hobbies</h3>
<ul class="square">
  <li>Reading</li>
  <li>Gaming
    <ul class="circle">
      <li>Mobile Games</li>
      <li>PC Games</li>
    </ul>
  </li>
  <li>Traveling</li>
</ul>

</body>
</html>
