<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:first-child {
            color: red;
        }
        a:last-child {
            color: green;
        }
        a:nth-child(3) {
            color: blue;
        }
        a:nth-child(4n) {
            color: orange;
        }
        a:nth-last-child(2) {
            color: purple;
        }
        input:focus {
            background-color: yellow;
        }
        </style>
</head>
<body>
    <h1>Pseudo Element</h1>
    <p id="first">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti illo quaerat, blanditiis labore ipsum ducimus vitae sed sit, perferendis obcaecati laudantium maiores amet voluptatibus veniam quos in molestiae repellat quisquam?</p>
    <ul>
        
    </ul>
    
</body>
</html>
