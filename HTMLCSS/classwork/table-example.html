<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 align="center">Table example</h2>
    <table border="1" align="center">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Raj</td>
            <td>22</td>
            <td>Surat</td>
        </tr>
        <tr>
            <td>Bhumie</td>
            <td>20</td>
            <td>Surat</td>
        </tr>
        <tr>
            <td>Druvil</td>
            <td>23</td>
            <td>Surat</td>
        </tr>
    </table>
    <h2 align="center">Table with section</h2>
    <table align="center" border="1" cellpadding="10px" cellspacing="10px">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Raj</td>
                <td>22</td>
                <td>Surat</td>
            </tr>
            <tr>
                <td>Bhumie</td>
                <td>20</td>
                <td>Surat</td>
            </tr>
            <tr>
                <td>Druvil</td>
                <td>23</td>
                <td>Surat</td>
            </tr>
        </tbody>
</body>
</html>
