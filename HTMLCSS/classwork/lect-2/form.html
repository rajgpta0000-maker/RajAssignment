<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Form Example</h1>
    <table align="center" border="1" cellspacing="10px" cellpadding="10px">
        <tr>
            <th>Enter Username:</th>
            <td><input type="text" name="username" required></td>
            <th>Email:</th>
            <td><input type="email" name="email" required></td>
        </tr>
        <tr>
            <th>Contact:</th>
            <td><input type="text" name="contact" id="contact"></td>
            <th>DOB</th>
            <td><input type="date" name="dob" id="dob"></td>
        </tr>
        <tr>
            <th>Hobby</th>
            <td>
                <input type="checkbox" name="hobby" value="cricket"> Cricket
                <input type="checkbox" name="hobby" value="football"> Football
                <input type="checkbox" name="hobby" value="badminton"> Badminton
            </td>
            <th>Gender</th>
            <td>
                <input type="radio" name="" id="">Male
                <input type="radio" name="" id="">FeMale
            </td>
        </tr>
        <tr>
            <th>Address:</th>
            <td><textarea name="address" id="address" cols="30" rows="10"></textarea></td>
            <th>City:</th>
            <td><select name="city" id="city">
                <option value="">Select City</option>
                <option value="surat">Surat</option>
                <option value="ahmedabad">Ahmedabad</option>
                <option value="vadodara">Vadodara</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="4" align="center"><input type="submit" value="Submit"></td>
        </tr>
    </table>
</body>
</html>
